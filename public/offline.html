<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors connexion · WorkSpace</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; background: #0f0a2e; color: #fff; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: rgba(255,255,255,.65); line-height: 1.5; margin: 0 0 24px; }
  button { background: #6366f1; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Vous êtes hors connexion</h1>
  <p>WorkSpace a besoin d'Internet pour afficher vos projets. Vérifiez votre connexion puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
